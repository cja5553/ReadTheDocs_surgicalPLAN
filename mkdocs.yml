site_name: surgicalPLAN
site_description: >-
  SurgicalPLAN (Surgical Postoperative Risk Prediction with Language Models
  Adapting to Clinical Notes) is a Python package for predicting postoperative
  risks from clinical notes using language models.
site_author: Charles Alba
repo_url: https://github.com/cja5553/ACS_demo_postoperative_risk_prediction_with_clinical_notes
repo_name: cja5553/surgicalplan

nav:
  - Home: index.md
  - Documentation:
      - Overview: documentation/index.md
      - Direct inference: documentation/direct_inference.md
      - Joint finetuning: documentation/joint_finetuning.md
      - Multi-task finetuning: documentation/multitask_finetuning.md
  - Examples: examples.md

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

plugins:
  - search

copyright: >-
  Copyright &copy; Charles Alba — Washington University in St. Louis
